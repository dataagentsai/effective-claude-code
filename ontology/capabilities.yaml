# Capabilities -- what a setup can DO, stated independently of what supplies it.
#
# source:  anthropic-official | claude-community | third-party | own
# status:  install | built | partial | gap
#
# The rule: reuse capability, build governance. Anything crossing a tool
# boundary is someone else's to maintain. Anything about whether OUR setup is
# correct and measurable is ours.

id: CAP-101
label: Diagnostics after every edit
kind: lsp-server
source: anthropic-official
supplier: "pyright-lsp / typescript-lsp / rust-analyzer-lsp / gopls-lsp (11 languages)"
status: install
note: >-
  The language server reports type errors and missing imports straight back
  after each edit, so a mistake is caught in the same turn rather than at the
  next build. Highest-leverage single install for a typed codebase, and it
  attacks the two signals our own quality scanner counts.
addresses: [FM-01, FM-02]

---

