id: ECC-0041
status: active
since: "0.1.0"
level: MUST
area: SUP
applies_to: [any-repo]

title: External hooks are read before they are enabled

requirement: |-
  A hook obtained from outside the team is read line by line and its commands
  understood before it is added to settings. Hooks are never enabled by
  installing a bundle that configures them silently.

failure_mode: |-
  Hooks run shell commands automatically, without a permission prompt, on
  triggers the user does not see. That is exactly the property that makes them
  useful for enforcement and exactly the property that makes an unreviewed one
  the highest-privilege thing in the setup. The blast radius is the developer's
  full local environment, including credentials the agent itself would have been
  prompted for.

discharges: [CANON-SEC-014]
check: checks/ecc_0041_hook_review.py
signals:
  - hooks configured in settings whose command is not defined inside this repo
  - hook commands that pipe from the network or invoke an interpreter on a remote file
remediation: |-
  Vendor the hook script into the repo so it is diffable and reviewable, and
  point the hook at the local path rather than at a downloaded one.
